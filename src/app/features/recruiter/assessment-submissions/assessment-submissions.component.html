<h1>Candidatos</h1>

@if (loading()) {
  <p>Cargando...</p>
} @else {
  <table mat-table [dataSource]="submissions()">
    <ng-container matColumnDef="candidateName">
      <th mat-header-cell *matHeaderCellDef>Nombre</th>
      <td mat-cell *matCellDef="let s">{{ s.candidateName }}</td>
    </ng-container>

    <ng-container matColumnDef="candidateEmail">
      <th mat-header-cell *matHeaderCellDef>Correo</th>
      <td mat-cell *matCellDef="let s">{{ s.candidateEmail }}</td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Estado</th>
      <td mat-cell *matCellDef="let s">{{ s.status }}</td>
    </ng-container>

    <ng-container matColumnDef="totalScore">
      <th mat-header-cell *matHeaderCellDef>Score</th>
      <td mat-cell *matCellDef="let s">{{ s.totalScore }} / {{ s.maxScore }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns" (click)="openResult(row)"></tr>
  </table>
}
