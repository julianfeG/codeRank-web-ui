<div class="test-results">
  <div class="results-header">
    @if (firstCase(); as fc) {
      <div class="first-case-preview">
        <div>
          <h4>Esperado</h4>
          <pre>{{ formatValue(fc.expectedOutput) }}</pre>
        </div>
        <div>
          <h4>Obtenido</h4>
          <pre>{{ formatValue(fc.actualOutput) }}</pre>
        </div>
      </div>
    }
    <p class="summary">{{ passedCount() }}/{{ totalCount() }} casos de prueba pasaron</p>
  </div>

  @if (showErrors() && firstCaseError(); as error) {
    <div class="errors-section">
      <div class="error-item">
        <h4>Error</h4>
        <pre>{{ error }}</pre>
      </div>
    </div>
  }
</div>
