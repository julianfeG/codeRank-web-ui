<mat-button-toggle-group
  class="language-toggle"
  [value]="selectedLanguage()"
  (change)="selectLanguage($event.value)"
  aria-label="Lenguaje"
>
  @for (lang of allowedLanguages(); track lang) {
    <mat-button-toggle [value]="lang">{{ languageLabel(lang) }}</mat-button-toggle>
  }
</mat-button-toggle-group>

<div class="editor-container" style="height: 300px">
  <ngx-monaco-editor
    style="height: 100%"
    [options]="editorOptions()"
    [ngModel]="code()"
    (ngModelChange)="onCodeChange($event)"
  />
</div>

<div class="actions">
  <button mat-raised-button class="run-button" [disabled]="running() || runDisabled()" (click)="run()">
    @if (running()) {
      <mat-spinner diameter="18"></mat-spinner>
    } @else {
      Ejecutar
    }
  </button>
</div>

@if (result(); as r) {
  @if (r.testResults) {
    <app-test-results [testResults]="r.testResults" [showDetails]="false" />
  }
}
