<mat-form-field class="language-select" subscriptSizing="dynamic">
  <mat-label>Lenguaje</mat-label>
  <mat-select
    panelClass="language-select-panel"
    [value]="selectedLanguage()"
    (selectionChange)="selectLanguage($event.value)"
    aria-label="Lenguaje"
  >
    @for (lang of allowedLanguages(); track lang) {
      <mat-option [value]="lang">{{ languageLabel(lang) }}</mat-option>
    }
  </mat-select>
</mat-form-field>

<div class="editor-container" style="height: 300px">
  <ngx-monaco-editor
    style="height: 100%"
    [options]="editorOptions()"
    [ngModel]="code()"
    (ngModelChange)="onCodeChange($event)"
  />
</div>

<div class="actions">
  <button mat-raised-button class="run-button" [disabled]="running() || runDisabled()" (click)="run()">
    @if (running()) {
      <mat-spinner diameter="18"></mat-spinner>
    } @else {
      Ejecutar
    }
  </button>
</div>

@if (result(); as r) {
  @if (r.testResults) {
    <app-test-results [testResults]="r.testResults" [showErrors]="true" />
  }
}
